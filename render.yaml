services:
  # Django Backend Service
  - type: web
    name: tbb-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Note: Media files are not persistent on free plan. Upgrade to Standard with disk mount for production.
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_HOST
        value: "dpg-db3a1ivlot8c73f415h0-a.oregon-postgres.render.com"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "tbb_db"
      - key: DB_USER
        value: "tbb_db_user"
      - key: DB_PASSWORD
        value: "IlCEv9pMXJFT6yF20mfw4nEOKVbC4y3C"
      - key: CORS_ORIGINS
        value: "https://thebusinessbrokers.vercel.app"
      - key: ENQUIRY_NOTIFY_EMAIL
        value: ""
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "website@businessbrokers.com.gh"
      - key: LOG_LEVEL
        value: "INFO"
    healthCheckPath: /api/
